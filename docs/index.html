<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>월 결산 현황판 — 주경야독 2026</title>
<style>
:root{--bg:#f7f8fa;--ink:#1d2330;--sub:#5b6474;--card:#fff;--line:#e3e6eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--ink:#e8ebf0;--sub:#9aa3b2;--card:#1c2028;--line:#2b313c}}
:root[data-theme="dark"]{--bg:#14171d;--ink:#e8ebf0;--sub:#9aa3b2;--card:#1c2028;--line:#2b313c}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 16px}
h1{font-size:28px;margin:0 0 8px}
p{color:var(--sub);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
</style>
</head>
<body>
<main>
<h1>월 결산 현황판</h1>
<p>결산 일정과 항목별 완료 여부를 한 화면에서 보는 개인 학습 사이트 · 가상 회사 · 합성 데이터 사용</p>
<div class="card">준비 중 — Sprint 2에서 지어낸 결산 일정 10~30건을 표로 보여 줍니다.</div>
</main>
</body>
</html>
